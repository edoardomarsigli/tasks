<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">

<title>Tasks</title>
<link rel="manifest" href="manifest.webmanifest">

<style>
:root {
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --bg: #f6f5f1; --panel: #ffffff; --field: #ffffff; --chip: #f1f0ec;
  --ink: #1b211e; --ink2: #47504b; --mute: #7c847f; --line: #e4e1d8; --line2: #d3cfc4;
  --acc: #0f766e; --acc2: #14b8a6; --accbg: #e3f3ef; --accink: #ffffff;
  --red: #d33b2c; --redbg: #fdecea; --amber: #b7650b; --amberbg: #fdf1df;
  --violet: #7349d6; --violetbg: #f0eafd; --blue: #2563eb; --bluebg: #e7eefd;
  --shadow: 0 1px 2px rgba(20, 28, 24, .06), 0 1px 1px rgba(20, 28, 24, .03);
  --shadow-lg: 0 -10px 40px rgba(20, 28, 24, .18);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #121614; --panel: #1a1f1d; --field: #141816; --chip: #232926;
    --ink: #e7ebe8; --ink2: #b9c0bb; --mute: #848d87; --line: #272d2a; --line2: #39413d;
    --acc: #26a596; --acc2: #2dd4bf; --accbg: #17332e; --accink: #ffffff;
    --red: #f0786b; --redbg: #3a1f1c; --amber: #f0b45a; --amberbg: #3a2c17;
    --violet: #b39cf5; --violetbg: #2b2440; --blue: #7aa5ff; --bluebg: #1d2a45;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --shadow-lg: 0 -10px 40px rgba(0, 0, 0, .55);
    color-scheme: dark;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font: 16px/1.45 var(--font); color: var(--ink); background: var(--bg); -webkit-font-smoothing: antialiased;
  padding-bottom: env(safe-area-inset-bottom); overflow-x: hidden; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
input, textarea, select { font: inherit; color: var(--ink); }
.i { width: 20px; height: 20px; flex: none; }
.hidden { display: none !important; }

.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(env(safe-area-inset-top) + 10px) 16px 8px; }
.bar { display: flex; align-items: center; gap: 10px; }
.brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 20px; letter-spacing: -.01em; }
.logo { width: 28px; height: 28px; border-radius: 9px; background: var(--acc); display: grid; place-items: center; color: #fff; }
.spacer { flex: 1; }
.sync { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--mute); padding: 6px 10px; border-radius: 99px; background: var(--chip); max-width: 58vw; }
.sync span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sync .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--acc2); flex: none; }
.sync.busy .dot { background: var(--blue); animation: pulse 1s infinite; }
.sync.warn { color: var(--amber); background: var(--amberbg); } .sync.warn .dot { background: var(--amber); }
.sync.bad { color: var(--red); background: var(--redbg); } .sync.bad .dot { background: var(--red); }
@keyframes pulse { 50% { opacity: .3; } }
.icon-btn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink2); }
.icon-btn:active { background: var(--chip); }

.quick { display: flex; gap: 8px; margin-top: 10px; }
.quick input { flex: 1; min-width: 0; height: 46px; border: 1px solid var(--line2); border-radius: 14px; padding: 0 14px; background: var(--field); outline: none; }
.quick input:focus { border-color: var(--acc2); box-shadow: 0 0 0 3px rgba(20, 184, 166, .18); }
.btn { height: 46px; padding: 0 16px; border-radius: 14px; background: var(--acc); color: var(--accink); font-weight: 600; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.ghost { background: var(--chip); color: var(--ink); }
.btn.danger { background: var(--redbg); color: var(--red); }
.btn:active { filter: brightness(.95); }
.hint { font-size: 12.5px; color: var(--mute); margin: 6px 2px 0; }

.chips { display: flex; gap: 6px; overflow-x: auto; padding: 10px 16px 4px; margin: 0 -16px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: none; height: 34px; padding: 0 12px; border-radius: 99px; background: var(--panel); border: 1px solid var(--line); font-size: 14px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink2); }
.chip.on { background: var(--acc); border-color: var(--acc); color: var(--accink); }
.chip .n { font-size: 12px; opacity: .75; font-variant-numeric: tabular-nums; }
.filters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
.filters select, .filters input { width: 100%; height: 38px; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); padding: 0 10px; min-width: 0; font-size: 15px; }
.filters input { outline: none; }
.filters select.on { border-color: var(--acc2); background: var(--accbg); color: var(--acc); font-weight: 600; }

main { padding: 4px 16px 90px; }
.group { margin: 16px 2px 6px; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); display: flex; gap: 8px; }
.card { display: flex; gap: 12px; align-items: flex-start; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 12px 10px; margin-bottom: 8px; box-shadow: var(--shadow); }
.card.done .title { color: var(--mute); text-decoration: line-through; }
.chk { width: 30px; height: 30px; flex: none; display: grid; place-items: center; color: var(--line2); margin-top: -3px; }
.chk.doing { color: var(--blue); } .chk.blocked { color: var(--violet); } .chk.done { color: var(--acc); }
.chk .i { width: 26px; height: 26px; }
.cbody { flex: 1; min-width: 0; }
.title { font-weight: 550; overflow-wrap: anywhere; }
.meta { display: flex; flex-wrap: wrap; gap: 5px 8px; margin-top: 4px; font-size: 13px; color: var(--mute); }
.tagx { background: var(--chip); border-radius: 6px; padding: 0 6px; }
.due.late { color: var(--red); font-weight: 600; } .due.today { color: var(--amber); font-weight: 600; }
.prio { color: var(--red); font-weight: 700; letter-spacing: -1px; margin-right: 4px; }
.reason { color: var(--violet); }
.run { color: var(--blue); font-weight: 600; }
.empty { text-align: center; color: var(--mute); padding: 50px 20px; }

/* full-screen panels: task, sign-in */
.sheet { position: fixed; inset: 0; z-index: 20; background: var(--bg); overflow-y: auto; padding-bottom: calc(env(safe-area-inset-bottom) + 40px); }
.sheet.enter { animation: up .18s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: 0; } }
.sheet .bar { position: sticky; top: 0; z-index: 2; background: var(--bg); padding: calc(env(safe-area-inset-top) + 8px) 8px 8px; border-bottom: 1px solid var(--line); }
.sheet .bar b { font-size: 17px; }
.form { padding: 8px 16px; }
.lbl { display: block; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); margin: 18px 2px 7px; }
.field { width: 100%; border: 1px solid var(--line2); border-radius: 12px; background: var(--field); padding: 10px 12px; outline: none; }
.field:focus { border-color: var(--acc2); }
textarea.field { resize: vertical; min-height: 46px; }
.ttl { font-size: 19px; font-weight: 600; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--chip); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { height: 38px; border-radius: 9px; font-size: 14px; color: var(--ink2); }
.seg button.on { background: var(--panel); color: var(--ink); font-weight: 600; box-shadow: var(--shadow); }
.row { display: flex; gap: 8px; align-items: center; }
.row > .field { flex: 1; min-width: 0; }
.cats { display: flex; flex-direction: column; gap: 8px; }
.proj { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.proj .ph { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.subchips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.subchip { height: 34px; padding: 0 12px; border-radius: 99px; border: 1px solid var(--line2); background: var(--field); display: inline-flex; align-items: center; gap: 5px; font-size: 14px; }
.subchip.on { background: var(--accbg); border-color: var(--acc2); color: var(--acc); font-weight: 600; }
.subchip .rm { margin: 0 -6px 0 2px; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; color: var(--mute); }
.subchip .rm .i { width: 14px; height: 14px; }
.addsel { height: 34px; border-radius: 99px; border: 1px dashed var(--line2); background: transparent; color: var(--acc); font-weight: 600; font-size: 14px; padding: 0 10px; max-width: 100%; }
.addsel.wide { height: 44px; border-radius: 12px; width: 100%; padding: 0 12px; }
button.vsub { cursor: pointer; }
.vtick { margin-left: auto; font-size: 13px; font-weight: 600; color: var(--acc); padding: 4px 6px; }
.x { color: var(--mute); padding: 4px; }
.list { display: flex; flex-direction: column; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.li { display: flex; align-items: center; gap: 10px; padding: 9px 10px 9px 12px; border-top: 1px solid var(--line); }
.li:first-child { border-top: 0; }
.li .t { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.li.done .t { color: var(--mute); text-decoration: line-through; }
.box { width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--line2); display: grid; place-items: center; flex: none; color: #fff; }
.box.on { background: var(--acc); border-color: var(--acc); }
.box .i { width: 16px; height: 16px; }
.log .when { font-size: 12px; color: var(--mute); display: block; }
.info { font-size: 13px; color: var(--mute); margin-top: 22px; line-height: 1.7; }
.gate { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 100vh; padding: 30px 24px; gap: 14px; }
.gate .logo { width: 64px; height: 64px; border-radius: 20px; }
.gate .logo .i { width: 36px; height: 36px; }
.gate h1 { margin: 6px 0 0; font-size: 26px; }
.gate p { margin: 0; color: var(--ink2); max-width: 360px; }
.gate .btn { min-width: 240px; }
.menu { position: fixed; z-index: 30; top: calc(env(safe-area-inset-top) + 54px); right: 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow-lg); padding: 6px; min-width: 230px; }
.menu button { display: flex; width: 100%; gap: 10px; align-items: center; padding: 11px 12px; border-radius: 10px; text-align: left; font-size: 15px; }
.menu button:active { background: var(--chip); }
.menu .who { font-size: 12.5px; color: var(--mute); padding: 6px 12px 8px; border-bottom: 1px solid var(--line); margin-bottom: 4px; overflow-wrap: anywhere; }
.scrim { position: fixed; inset: 0; z-index: 25; }
/* task page, read-only */
.view { padding: 14px 16px 120px; }
.vtitle { font-size: 22px; font-weight: 650; line-height: 1.3; margin: 4px 0 12px; overflow-wrap: anywhere; letter-spacing: -.01em; }
.badges { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 99px; background: var(--chip); font-size: 13.5px; font-weight: 600; color: var(--ink2); }
.badge .i { width: 16px; height: 16px; }
.badge.todo { background: var(--chip); } .badge.doing { background: var(--bluebg); color: var(--blue); }
.badge.blocked { background: var(--violetbg); color: var(--violet); } .badge.done { background: var(--accbg); color: var(--acc); }
.badge.late { background: var(--redbg); color: var(--red); } .badge.today { background: var(--amberbg); color: var(--amber); }
.badge.prio { background: var(--redbg); color: var(--red); }
.vsec { margin-top: 20px; }
.vsec h4 { margin: 0 0 7px 2px; font-size: 12.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--mute); }
.vbox { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 11px 13px; }
.vnotes { white-space: pre-wrap; overflow-wrap: anywhere; }
.vsubs { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 7px; }
.vsub { height: 28px; padding: 0 10px; border-radius: 99px; border: 1px solid var(--line2); display: inline-flex; align-items: center; font-size: 13.5px; color: var(--ink2); }
.vsub.on { background: var(--accbg); border-color: transparent; color: var(--acc); font-weight: 600; }
.vli { display: flex; gap: 10px; align-items: flex-start; padding: 6px 0; }
.vli + .vli { border-top: 1px solid var(--line); }
.vli .mk { width: 20px; height: 20px; border-radius: 6px; border: 2px solid var(--line2); flex: none; margin-top: 2px; display: grid; place-items: center; color: #fff; }
.vli .mk.on { background: var(--acc); border-color: var(--acc); }
.vli .mk .i { width: 13px; height: 13px; }
.vli.done .t { color: var(--mute); text-decoration: line-through; }
.actions { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; display: flex; gap: 10px; padding: 12px 16px calc(env(safe-area-inset-bottom) + 12px); background: linear-gradient(transparent, var(--bg) 30%); }
.actions .btn { flex: 1; }
.btn.small { height: 36px; padding: 0 14px; border-radius: 11px; font-size: 14.5px; }

/* drag and drop (long press on a card) */
.card { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; transition: transform .12s ease, box-shadow .12s ease; }
.card.press { transform: scale(.975); }
.card.ph { opacity: .35; border-style: dashed; box-shadow: none; }
.drag-ghost { position: fixed; z-index: 50; pointer-events: none; margin: 0 !important; box-shadow: 0 18px 44px rgba(0, 0, 0, .28) !important; transform: rotate(1.2deg) scale(1.03); opacity: .97; }
.grp.vacant { display: none; }
body.dragging .grp.vacant { display: block; }
.dropzone { border: 2px dashed var(--line2); border-radius: 14px; padding: 16px; text-align: center; color: var(--mute); font-size: 14px; margin-bottom: 8px; }
.grp:has(.card) .dropzone { display: none; }
body.dragging .group { color: var(--acc); }
body.dragging { -webkit-user-select: none; user-select: none; }

#toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 22px); transform: translateX(-50%); z-index: 40; background: var(--ink); color: var(--bg); padding: 11px 16px; border-radius: 12px; font-size: 14.5px; max-width: calc(100vw - 32px); box-shadow: var(--shadow-lg); display: flex; gap: 14px; align-items: center; }
#toast.err { background: var(--red); color: #fff; }
#toast button { font-weight: 700; color: var(--acc2); }
</style>
</head>
<body>
<div id="app" class="hidden">
  <header class="top">
    <div class="bar">
      <div class="brand"><span class="logo" id="logo"></span>Tasks</div>
      <div class="spacer"></div>
      <button class="sync" id="sync"><span class="dot"></span><span id="synctext">…</span></button>
      <button class="icon-btn" id="menubtn" aria-label="Menu"></button>
    </div>
    <form class="quick" id="quickform" autocomplete="off">
      <input id="quick" enterkeyhint="done" placeholder="Add a task…" spellcheck="false">
      <button class="btn" aria-label="Add" id="addbtn"></button>
    </form>
    <div class="chips" id="nav"></div>
    <div class="filters">
      <select id="proj" aria-label="Project"></select>
      <select id="sub" aria-label="Subproject"></select>
      <select id="tag" aria-label="Tag"></select>
      <input id="search" type="search" placeholder="Search" aria-label="Search">
    </div>
  </header>
  <main id="list"></main>
</div>
<div id="gate" class="hidden"></div>
<div id="sheet-root"></div>
<div id="menu-root"></div>
<div id="toast" class="hidden"></div>

<script>
'use strict';
// ------------------------------------------------------------------ settings of the Google project
const GOOGLE = {
  clientId: '785368500845-2odo9dcbi8dgh3v56sb23pb4t78g4b5v.apps.googleusercontent.com',
  apiKey: 'AIzaSyDGFVzSuCTK1mit7fyBxFz6yPBaw5OAcW4',      // only for the file chooser (Google Picker)
  appId: '785368500845',
  scope: 'https://www.googleapis.com/auth/drive.file',
  fileName: 'tasks-data.json',
};

// ------------------------------------------------------------------ helpers
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pad = n => String(n).padStart(2, '0');
const low = s => (s || '').toLowerCase();
const uid = () => [...crypto.getRandomValues(new Uint8Array(6))].map(b => b.toString(16).padStart(2, '0')).join('');
const lsGet = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } };
const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const STATUS = { todo: 'To do', doing: 'In progress', blocked: 'Waiting', done: 'Done' };
const PRIO = ['None', 'Low', 'Medium', 'High'];
const REPEATS = [['', 'Does not repeat'], ['daily', 'Every day'], ['weekdays', 'Every working day (Mon–Fri)'], ['weekly', 'Every week'], ['biweekly', 'Every 2 weeks'], ['monthly', 'Every month']];
const REASONS = ['Waiting for parts', 'Waiting for the customer', 'Waiting for a colleague', 'Waiting for information'];
const NAV = [['all', 'All'], ['active', 'Active'], ['today', 'Today'], ['late', 'Overdue'], ['doing', 'In progress'], ['todo', 'To do'], ['blocked', 'Waiting'], ['done', 'Done']];
const TOMB_DAYS = 90;
const ICONS = {
  check: '<path d="m5 12.5 4.5 4.5L19 7.5"/>',
  circle: '<circle cx="12" cy="12" r="8.5"/>',
  half: '<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor"/>',
  pause: '<circle cx="12" cy="12" r="8.5"/><path d="M10 9v6M14 9v6"/>',
  checkc: '<circle cx="12" cy="12" r="8.5" fill="currentColor"/><path d="m8.5 12.2 2.4 2.4 4.8-5" stroke="#fff"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  back: '<path d="m15 6-6 6 6 6"/>',
  more: '<circle cx="12" cy="5.5" r="1.5" fill="currentColor"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/><circle cx="12" cy="18.5" r="1.5" fill="currentColor"/>',
  trash: '<path d="M4 7h16M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/>',
  x: '<path d="M6 6l12 12M18 6 6 18"/>',
  refresh: '<path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/>',
  file: '<path d="M6 3.5h8l4.5 4.5v12.5H6z"/><path d="M14 3.5V8h4.5"/>',
  out: '<path d="M15 4h4a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1h-4M10 17l5-5-5-5M15 12H4"/>',
  folder: '<path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h3.8l2 2.3h7.2a2 2 0 0 1 2 2v7.7a2 2 0 0 1-2 2H5.5a2 2 0 0 1-2-2z"/>',
  edit: '<path d="M4 20h4.2L19.3 8.9a2.1 2.1 0 0 0-3-3L5.2 17v3z"/><path d="m14.5 7.5 2.9 2.9"/>',
  cal: '<rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  repeat: '<path d="m17 2.5 3 3-3 3"/><path d="M4 11.5v-1a5 5 0 0 1 5-5h11"/><path d="m7 21.5-3-3 3-3"/><path d="M20 12.5v1a5 5 0 0 1-5 5H4"/>',
  copy: '<rect x="8.5" y="8.5" width="12" height="12" rx="2"/><path d="M15.5 8.5V5.5a2 2 0 0 0-2-2h-8a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h3"/>',
};
const icon = n => `<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${ICONS[n] || ''}</svg>`;

const isoOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayISO = () => isoOf(new Date());
const parseISO = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const dayStart = d => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
function fmtDay(d) {
  const diff = Math.round((dayStart(d) - dayStart(new Date())) / 86400000);
  if (diff === 0) return 'Today'; if (diff === 1) return 'Tomorrow'; if (diff === -1) return 'Yesterday';
  const s = `${d.getDate()} ${MONTHS[d.getMonth()]}`;
  return d.getFullYear() === new Date().getFullYear() ? s : `${s} ${d.getFullYear()}`;

  const isProj = el.id === 'f-addproj';
  if (v === '__new__') {
    v = clean(prompt(isProj ? 'Name of the new project' : `New subproject of “${el.dataset.addsub}” (e.g. em07)`));
    if (!v) { renderSheet(); return; }
    if (!isProj && v.includes('/')) v = v.replace(/\//g, '-');
  }
  if (isProj) {
    const known = D.projects.find(r => low(r.name) === low(v));
    change(() => { t.cats = normCats([...t.cats, { project: known ? known.name : v, sub: '' }]); });
    toast(`${t.title} → ${known ? known.name : v}`);
  } else {
    const p = el.dataset.addsub, reg = D.projects.find(r => low(r.name) === low(p));
    const known = reg && reg.subs.find(x => low(x) === low(v));
    change(() => { t.cats = normCats([...t.cats, { project: p, sub: known || v }]); });
    toast(`${t.title} → ${p} › ${known || v}`);
  }
}

// ------------------------------------------------------------------ taps
const ACT = {
  signin: () => signIn(false),
  retry: () => { if (tokenOK()) afterSignIn(); else signIn(); },
  pick: () => pickFile(),
  create: () => { if (confirm('Start a new, empty task list on this Google Drive?')) createFile(); },
  signout: () => signOut(),
  nav: el => { UI.nav = el.dataset.k; UI.q = ''; $('#search').value = ''; lsSet('tasks.m.nav', UI.nav); render(); scrollTo(0, 0); },
  open: el => openTask(el.closest('[data-id]').dataset.id),
  done: el => {
    const t = findTask(el.closest('[data-id]').dataset.id); if (!t) return;
    const id = t.id, rep = t.repeat;
    change(() => setStatus(t, t.status === 'done' ? 'todo' : 'done'));
    if (t.status === 'done' && !rep) toast('Done: ' + t.title, { undo: () => { const x = findTask(id); if (x) change(() => setStatus(x, 'todo')); } });
  },
  close: () => history.back(),
  edit: () => editTask(),
  'view-done': () => {
    const t = findTask(UI.open); if (!t) return;
    const rep = t.repeat;
    change(() => setStatus(t, t.status === 'done' ? 'todo' : 'done'));
    if (t.status === 'done') { toast(rep ? 'Done — the next one is in the list' : 'Done: ' + t.title); history.back(); }
  },
  status: el => { const t = findTask(UI.open); change(() => setStatus(t, el.dataset.v, el.dataset.v === 'blocked' ? (t.reason || '') : null)); },
  prio: el => { const t = findTask(UI.open); change(() => { t.priority = +el.dataset.v; }); },
  'clear-due': () => { const t = findTask(UI.open); change(() => { t.due = ''; }); },
  'tick-cat': el => {
    const t = findTask(UI.open); const c = t && t.cats.find(c => c.project === el.dataset.p && c.sub === el.dataset.s); if (!c) return;
    change(() => { c.done = !c.done; });
    const left = t.cats.filter(x => x.sub && !x.done).map(x => x.sub);
    toast(left.length ? `${c.sub} ${c.done ? 'done' : 'to do'} · still missing ${left.join(', ')}` : 'Done in all subprojects');
  },
  'tick-all': el => { const t = findTask(UI.open); change(() => t.cats.forEach(c => { if (c.sub && c.project === el.dataset.p) c.done = true; })); toast('Done in all subprojects'); },
  'rm-cat': el => {
    const t = findTask(UI.open), p = el.dataset.p, sub = el.dataset.s;
    change(() => {
      t.cats = t.cats.filter(c => !(c.project === p && c.sub === sub));
      if (!t.cats.some(c => c.project === p)) t.cats = normCats([...t.cats, { project: p, sub: '' }]);   // stays in the project
    });
  },
  'rm-proj': el => { const t = findTask(UI.open); if (confirm(`Remove “${el.dataset.p}” from this task?`)) change(() => { t.cats = t.cats.filter(c => c.project !== el.dataset.p); }); },

  'tick-sub': el => { const t = findTask(UI.open); const s = t.subs.find(s => s.id === el.dataset.s); if (s) change(() => { s.done = !s.done; }); },
  'rm-sub': el => { const t = findTask(UI.open); change(() => { t.subs = t.subs.filter(s => s.id !== el.dataset.s); }); },
  'add-sub': () => { const t = findTask(UI.open), v = $('#f-addsub').value.trim(); if (v) change(() => t.subs.push({ id: uid(), t: v, done: false })); },
  'add-log': () => { const t = findTask(UI.open), v = $('#f-addlog').value.trim(); if (v) change(() => t.log.push({ id: uid(), at: Date.now(), t: v })); },
  delete: () => {
    const t = findTask(UI.open); if (!t || !confirm(`Delete “${t.title}”?`)) return;
    const copy = JSON.parse(JSON.stringify(t)), idx = D.tasks.indexOf(t);
    const steps = UI.mode === 'edit' ? -2 : -1;
    UI.open = null; UI.mode = 'view'; renderSheet(); history.go(steps);
    change(() => { D.tasks = D.tasks.filter(x => x.id !== t.id); });
    toast('Deleted: ' + t.title, { undo: () => change(() => { D.tasks.splice(Math.min(idx, D.tasks.length), 0, copy); }) });
  },
  dup: () => {
    const t = findTask(UI.open); const c = JSON.parse(JSON.stringify(t));
    Object.assign(c, { id: uid(), created: Date.now(), time: [], hist: [], log: [], title: t.title + ' (copy)' });
    for (const s of c.subs) s.id = uid();
    change(() => D.tasks.splice(D.tasks.indexOf(t) + 1, 0, c));
    UI.open = c.id; renderSheet(); toast('Duplicated');
  },
  menu: () => {
    $('#menu-root').innerHTML = `<div class="scrim" data-act="menu-close"></div><div class="menu">
      <div class="who">${G.email ? 'Google: ' + esc(G.email) : 'Not signed in'}</div>
      <button data-act="sync-now">${icon('refresh')} Sync now</button>
      <button data-act="pick">${icon('file')} Choose another file</button>
      <button data-act="signout">${icon('out')} Sign out</button></div>`;
  },
  'menu-close': () => { $('#menu-root').innerHTML = ''; },
  'sync-now': () => { $('#menu-root').innerHTML = ''; if (tokenOK()) sync(); else signIn(); },
  sync: () => { if (!tokenOK()) signIn(); else sync(); },
};
document.addEventListener('click', e => {
  if (Date.now() - (UI.dragEnd || 0) < 450) { e.preventDefault(); e.stopPropagation(); return; }   // the tap that ends a drag
  const a = e.target.closest('[data-act]');
  if (a && ACT[a.dataset.act]) { e.preventDefault(); if (a.closest('.menu')) $('#menu-root').innerHTML = ''; ACT[a.dataset.act](a, e); }
});
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const id = e.target.id;
  if (id === 'f-addsub' || id === 'f-addlog') { e.preventDefault(); ACT[{ 'f-addsub': 'add-sub', 'f-addlog': 'add-log' }[id]](); }
  else if (id === 'f-title') { e.preventDefault(); e.target.blur(); }
});
$('#quickform').addEventListener('submit', e => {
  e.preventDefault();
  const el = $('#quick'), text = el.value.trim(); if (!text) return;
  const t = parseQuick(text, UI.project);
  if (!t.title) { toast('Write a title first.', { error: true }); return; }
  if (!t.cats.length && UI.project) t.cats = normCats([{ project: UI.project, sub: UI.sub }]);
  if (UI.tag && !t.tags.some(g => low(g) === low(UI.tag))) t.tags.push(UI.tag);
  if (['doing', 'blocked'].includes(UI.nav)) setStatus(t, UI.nav, '');
  change(() => D.tasks.unshift(t));
  el.value = ''; toast('Added: ' + t.title);
});
$('#search').addEventListener('input', e => { UI.q = e.target.value; render(); });
$('#sync').dataset.act = 'sync';
$('#menubtn').dataset.act = 'menu';
$('#menubtn').innerHTML = icon('more'); $('#addbtn').innerHTML = icon('plus'); $('#logo').innerHTML = icon('check');

function signOut() {
  if (G.dirty && !confirm('Some changes have not reached Drive yet and will be lost. Sign out anyway?')) return;
  if (G.token) fetch('https://oauth2.googleapis.com/revoke?token=' + encodeURIComponent(G.token), { method: 'POST', mode: 'no-cors' }).catch(() => {});
  for (const k of ['token', 'exp', 'state', 'silentAt']) ssSet('tasks.m.' + k, null);
  for (const k of ['data', 'dirty', 'fileId', 'version', 'email', 'on']) lsSet('tasks.m.' + k, null);
  location.reload();
}

let toastTimer = null;
function toast(msg, opts = {}) {
  const el = $('#toast'); el.className = opts.error ? 'err' : '';
  el.innerHTML = `<span>${esc(msg)}</span>${opts.undo ? '<button>Undo</button>' : ''}`;
  if (opts.undo) el.querySelector('button').onclick = () => { el.className = 'hidden'; opts.undo(); };
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.className = 'hidden'; }, opts.undo ? 5000 : 2600);
}

// ------------------------------------------------------------------ start
const back = readRedirect();
if (!back && ssGet('tasks.m.token') && Date.now() < (+ssGet('tasks.m.exp') || 0) - 60000) { G.token = ssGet('tasks.m.token'); G.exp = +ssGet('tasks.m.exp'); }
if (D && G.fileId) { showApp(); render(); setSync(tokenOK() ? 'idle' : G.wanted ? 'auth' : 'idle'); }
else showGate('signin');
if (back && back.ok) { G.wanted = true; lsSet('tasks.m.on', '1'); afterSignIn(); }
else if (back && back.problem) signInProblem(back.problem);
else if (back && back.error) {
  if (!back.silent) signInProblem(back.error === 'access_denied' ? 'Access was not allowed on Google’s page.' : 'Google answered: ' + back.error);
  else if (!(D && G.fileId)) showGate('signin');      // quiet renewal not possible: a tap on "Sign in" is needed
}
else if (tokenOK()) { if (G.fileId) sync(); }
else if (D && G.fileId) renewQuietly();
setInterval(() => { if (D && !UI.open) render(); }, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
